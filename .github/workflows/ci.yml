name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile application modules
        run: python -m py_compile support_portal/*.py

  postgres-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: apoio_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apoio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
      - name: Apply support portal migration
        env:
          APOIO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/apoio_ci
        run: psql "$APOIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_support_portal.sql
      - name: Apply internal change request RLS migration
        env:
          APOIO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/apoio_ci
        run: psql "$APOIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0002_internal_change_request_links.sql
      - name: Prove PostgreSQL row security
        env:
          APOIO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/apoio_ci
        run: psql "$APOIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres_rls.sql
